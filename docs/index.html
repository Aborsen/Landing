<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<title>Documentation — Insightis</title>
<meta name="description" content="Insightis documentation — get started, learn how AI Chat answers your questions, define metrics in the Semantic Layer, connect 200+ data sources, manage your account, and read our reference on the AI model, copyrights, and data storage.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Geist', sans-serif;
  background: var(--ins-surface-page);
  color: #E8F2F5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  opacity: .4; mix-blend-mode: overlay;
}



/* ── ANIMATIONS ── */
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideInRight { from{opacity:0;transform:translateX(24px)} to{opacity:1;transform:translateX(0)} }
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

.fu0 { animation: fadeUp .7s ease both; }
.fu1 { animation: fadeUp .7s ease .1s both; }
.fu2 { animation: fadeUp .7s ease .2s both; }
.fu3 { animation: fadeUp .7s ease .35s both; }
.fu4 { animation: fadeUp .7s ease .5s both; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

/* ── SECTION SPACING ── */
section { position: relative; }

/* ── DOCS TABS BAR ── */
.docs-tabs-bar {
  position: sticky;
  top: 68px;
  z-index: 40;
  background: rgba(10,14,19,0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.055);
}

/* ── DOCS 3-COLUMN LAYOUT ── */
.docs-layout {
  display: grid;
  grid-template-columns: 240px 1fr 160px;
  align-items: start;
  position: relative;
  z-index: 1;
}

/* ── DOCS SIDEBAR (LEFT) ── */
.docs-sidebar-col {
  position: sticky;
  top: 72px;
  max-height: calc(100vh - 72px);
  overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,0.055);
  padding: 24px 0;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.docs-sidebar-col::-webkit-scrollbar { display: none; }

/* ── DOCS TOC (RIGHT) ── */
.docs-toc-col {
  position: sticky;
  top: 72px;
  max-height: calc(100vh - 72px);
  overflow-y: auto;
  border-left: 1px solid rgba(255,255,255,0.055);
  padding: 28px 8px 28px 16px;
}
.docs-toc-col::-webkit-scrollbar { width: 3px; }

/* ── DOCS CONTENT (CENTER) ── */
.docs-content-col {
  padding: 40px 48px 80px;
  min-width: 0;
}

/* ── RESPONSIVE ── */
@media (max-width: 1100px) {
  .docs-layout { grid-template-columns: 220px 1fr; }
  .docs-toc-col { display: none; }
}
/* Opt out of the global `main > *` content-visibility optimization: it makes
   this wrapper a containing block, which would trap the mobile drawer's
   position:fixed inside it instead of the viewport. */
main > .docs-page-wrap { content-visibility: visible; contain-intrinsic-size: none; }

/* Mobile docs nav (QA #2) — breadcrumb bar with a menu icon that opens the
   navigation as a full-screen drawer. Hidden on desktop. */
.docs-mobile-breadcrumb { display: none; }
.docs-drawer-close { display: none; }
@media (max-width: 768px) {
  .docs-layout { grid-template-columns: 1fr; }
  .docs-sidebar-col { display: none; }
  .docs-mobile-breadcrumb {
    display: flex; align-items: center; gap: 12px;
    width: 100%; margin: 8px 0 0; padding: 12px 2px;
    border-bottom: 1px solid rgba(255,255,255,0.055);
    font-size: 14px; color: var(--ins-text-disabled);
    min-width: 0;
    /* Pin to the very top while scrolling (the site header does not stick,
       so no room is reserved for it). Solid background hides the content
       scrolling beneath. */
    position: sticky; top: 0; z-index: 30;
    background: var(--ins-surface-page);
    padding-top: 14px;
  }
  .docs-mobile-breadcrumb__menu {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; flex-shrink: 0;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px;
    color: var(--ins-text-body); cursor: pointer;
  }
  .docs-mobile-breadcrumb__trail {
    display: flex; align-items: center; gap: 8px;
    min-width: 0; white-space: nowrap; overflow: hidden;
  }
  .docs-mobile-breadcrumb__trail strong {
    color: var(--ins-color-gray-100); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis;
  }
  .docs-sidebar-col.is-open {
    display: block;
    position: fixed; inset: 0; z-index: 80;
    max-height: none; overflow-y: auto;
    background: var(--ins-surface-page);
    border-right: none;
    padding: 12px 12px 32px;
    animation: docsDrawerIn .25s ease-out;
  }
  @keyframes docsDrawerIn {
    from { transform: translateX(-100%); }
    to   { transform: translateX(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .docs-sidebar-col.is-open { animation: none; }
  }
  /* While the drawer is open, lift the docs layout's stacking context above
     the sticky site header (z-index 50) so the drawer fully covers it. */
  .docs-layout:has(.docs-sidebar-col.is-open) { z-index: 90; }
  .docs-drawer-close {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    margin: 4px 4px 12px auto;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 8px;
    color: var(--ins-text-body); cursor: pointer;
  }
  .docs-content-col { padding: 24px 20px 60px; }
  /* The sticky breadcrumb bar above already shows the same trail —
     don't duplicate it inside the article on mobile. */
  .docs-content-col .ins-breadcrumbs { display: none; }
}

/* ── DOCS MD-SECTION BODY ── */
.doc-section-body { font-size: 15px; color: var(--ins-text-body); line-height: 1.8; }
.doc-section-body p { margin: 0 0 14px; }
.doc-section-body p:last-child { margin-bottom: 0; }
.doc-section-body ul,
.doc-section-body ol { margin: 0 0 14px; padding-left: 22px; }
.doc-section-body li { margin: 4px 0; }
.doc-section-body li::marker { color: #3A5260; }
.doc-section-body strong { color: var(--ins-text-body); font-weight: 600; }
/* Links carry a visible underline so they read as links in body copy, not just
   as differently-coloured words. The card grid opts out (it has its own frame). */
.doc-section-body a {
  color: var(--ins-text-highlight);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-decoration-color: rgba(14,196,193,0.45);
  text-underline-offset: 3px;
  transition: color .15s, text-decoration-color .15s;
}
.doc-section-body a:hover {
  color: #14E0DD;
  text-decoration-color: #14E0DD;
}
.doc-section-body a.doc-card,
.doc-section-body a.doc-card:hover { text-decoration: none; }
.doc-section-body code {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 13px;
  color: #E8F2F5;
  font-family: 'Geist Mono', ui-monospace, monospace;
}
/* ── PRODUCT SCREENSHOTS ──
   Captured from the app in dark mode and cropped to the relevant UI, so they
   sit natively on the dark docs page — no frame needed. Rendered at roughly
   half the text column so a screenshot supports the step instead of
   dominating it. */
.doc-section-body img {
  display: block;
  /* Screenshots are full-page app views, so they run the width of the column —
     enough to read the layout at a glance. Click to open full size. The height
     cap keeps tall portrait shots from running down the page; both caps apply
     and the aspect ratio is preserved. */
  max-width: 100%;
  max-height: 620px;
  width: auto;
  height: auto;
  margin: 18px 0;
  cursor: zoom-in;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.07);
  transition: border-color .15s;
}
.doc-section-body img:hover { border-color: rgba(10,152,150,0.55); }

/* Screenshots are wrapped in a figure by the renderer so a hover badge can
   advertise that the image opens full size. */
.doc-figure {
  position: relative;
  display: table;      /* shrink-wraps to the image's rendered width */
  margin: 18px 0;
}
.doc-figure img { margin: 0; }
.doc-figure__zoom {
  position: absolute;
  top: 10px;
  right: 10px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px;
  border-radius: 6px;
  background: rgba(6,10,14,0.82);
  border: 1px solid rgba(255,255,255,0.14);
  color: #E8F2F5;
  font-size: 11px;
  line-height: 1;
  letter-spacing: 0.01em;
  opacity: 0;
  transform: translateY(-2px);
  transition: opacity .15s, transform .15s;
  pointer-events: none;
}
.doc-figure:hover .doc-figure__zoom,
.doc-figure:focus-within .doc-figure__zoom { opacity: 1; transform: translateY(0); }
@media (hover: none) { .doc-figure__zoom { opacity: 1; } }

/* ── IMAGE LIGHTBOX ── click a screenshot to view it full size */
.doc-lightbox {
  position: fixed;
  inset: 0;
  /* Above the sticky site header (z-index 50) and the mobile nav drawer.
     Only effective because the overlay is portalled to <body> — see docs.jsx. */
  z-index: 9000;
  background: rgba(4,8,12,0.88);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 40px 28px;
  cursor: zoom-out;
  animation: docLightboxIn .14s ease-out;
}
@keyframes docLightboxIn { from { opacity: 0; } to { opacity: 1; } }
.doc-lightbox img {
  /* Screenshots ship at 1800px wide, so allow the full resolution — the point
     of enlarging is to read the sidebar and panel detail. */
  max-width: min(100%, 1800px);
  max-height: calc(100vh - 130px);
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 24px 70px rgba(0,0,0,0.6);
  cursor: default;
}
.doc-lightbox__caption {
  margin: 0;
  max-width: 700px;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ins-text-body);
}
.doc-lightbox__close {
  position: absolute;
  top: 18px;
  right: 20px;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  color: #E8F2F5;
  cursor: pointer;
  transition: background .15s;
}
.doc-lightbox__close:hover { background: rgba(255,255,255,0.14); }
@media (max-width: 768px) {
  .doc-lightbox { padding: 56px 14px 24px; }
  .doc-lightbox img { max-height: calc(100vh - 150px); }
}

/* ── STEPS ──
   Ordered lists in the docs are procedures, so they render as steps:
   numbered token + connecting rail. Screenshots can sit inside a step. */
.doc-section-body ol {
  list-style: none;
  padding-left: 0;
  margin: 18px 0;
  counter-reset: doc-step;
}
.doc-section-body ol > li {
  counter-increment: doc-step;
  position: relative;
  padding-left: 38px;
  margin: 0 0 16px;
  list-style: none;
}
.doc-section-body ol > li::marker { content: none; }
.doc-section-body ol > li::before {
  content: counter(doc-step);
  position: absolute;
  left: 0; top: 0;
  width: 23px; height: 23px;
  box-sizing: border-box;
  border-radius: 50%;
  background: rgba(9,160,157,0.14);
  border: 1px solid rgba(9,160,157,0.42);
  color: var(--ins-text-highlight);
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 11px;
  line-height: 21px;
  text-align: center;
}
.doc-section-body ol > li:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 11px; top: 27px; bottom: -12px;
  width: 1px;
  background: rgba(255,255,255,0.08);
}
.doc-section-body ol > li > img { margin: 12px 0 2px; }

/* ── CALLOUTS ── written as `> [!NOTE]` / `[!TIP]` / `[!WARNING]` in markdown */
.doc-callout {
  margin: 18px 0;
  padding: 14px 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.09);
  border-left: 2px solid var(--ins-text-highlight);
  background: rgba(255,255,255,0.03);
}
.doc-callout__label {
  display: block;
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ins-text-highlight);
  margin-bottom: 6px;
}
.doc-callout__body p { margin: 0; }
.doc-callout__body p + p { margin-top: 10px; }
.doc-callout--warning { border-left-color: #FBBF24; }
.doc-callout--warning .doc-callout__label { color: #FBBF24; }

/* ── CARD GRID ── used on the docs home page to point at the main sections */
.doc-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
  margin: 20px 0 4px;
}
.doc-card {
  display: block;
  padding: 16px 18px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  text-decoration: none;
}
.doc-card:hover {
  border-color: rgba(10,152,150,0.45);
  background: rgba(255,255,255,0.05);
}
.doc-card__title {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: var(--ins-color-gray-100, #E8F2F5);
  margin-bottom: 4px;
}
.doc-card__desc {
  display: block;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ins-text-body);
}
.doc-card:hover .doc-card__title { color: var(--ins-text-highlight); }
